<style>
  *{box-sizing:border-box;}
  body{margin:0;font-family:-apple-system,BlinkMacSystemFont,'SF Pro Display','Inter',sans-serif;background:#000;color:#fff;}
  .bg-media{position:fixed;inset:0;width:100%;height:100%;object-fit:cover;z-index:0;}
  .overlay{position:fixed;inset:0;z-index:1;background:linear-gradient(180deg, rgba(0,0,0,0.82) 0%, rgba(0,0,0,0.58) 28%, rgba(0,0,0,0.20) 55%, rgba(0,0,0,0) 75%), linear-gradient(180deg, rgba(255,64,21,0) 0%, rgba(255,64,21,0.3) 55%, rgba(255,64,21,0.88) 100%);}
  main{position:relative;z-index:2;min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:flex-start;padding:14vh 20px 32px;text-align:center;}
  .avatar{width:96px;height:96px;border-radius:50%;object-fit:cover;border:2px solid rgba(255,255,255,0.9);margin-bottom:16px;background:#333;}
  h1{font-size:26px;font-weight:800;margin:0 0 4px;letter-spacing:-0.01em;}
  .bio{font-size:14px;color:rgba(255,255,255,0.75);margin:0 0 28px;}
  .links{width:100%;max-width:340px;display:flex;align-items:center;justify-content:center;gap:14px;flex-wrap:wrap;}
  .link{display:flex;align-items:center;justify-content:center;width:52px;height:52px;border-radius:50%;background:rgba(255,255,255,0.12);border:1px solid rgba(255,255,255,0.18);color:#fff;text-decoration:none;backdrop-filter:blur(8px);transition:transform .18s ease, background-color .18s ease;}
  .link:hover, .link:focus-visible{transform:translateY(-2px);background:rgba(255,255,255,0.22);}
  .link:active{transform:translateY(0);opacity:0.85;}
  .link svg{width:22px;height:22px;}
  .link.whats{background:#25D366;color:#06210F;border-color:rgba(0,0,0,0.1);}
  .link.whats:hover{filter:brightness(1.08);}
  @media (prefers-reduced-motion: reduce){ .link{ transition:none; } }
</style>
